name: Contador de visitas

on:
  repository_dispatch:
    types: [visita]

jobs:
  contar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Aumentar contador
        run: |
          NUM=$(cat visitas.txt)
          NUM=$((NUM + 1))
          echo $NUM > visitas.txt

      - name: Guardar contador
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitas.txt
          git commit -m "Actualizar contador de visitas" || exit 0
          git push
